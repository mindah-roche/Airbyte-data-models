version: 2

models:
  - name: fct_track_plays
    description: >
      Fact table containing one row per track play event.
      This is the core fact table for analyzing listening behavior over time.
      Grain: One row per play event (identified by play_event_id)
    columns:
      - name: play_event_id
        description: Unique identifier for each play event
        tests:
          - unique
          - not_null
      - name: played_at
        description: Timestamp when track was played
        tests:
          - not_null
      - name: played_date
        description: Date when track was played (for daily aggregations)
      - name: played_hour
        description: Hour of day (0-23) when track was played
      - name: played_day_of_week
        description: Day of week (1=Sunday, 7=Saturday)
      - name: track_id
        description: Foreign key to dim_tracks
        tests:
          - not_null
      - name: artist_id
        description: Foreign key to dim_artists
      - name: track_duration_minutes
        description: Track duration in minutes
        
  - name: dim_tracks
    description: >
      Dimension table containing one row per track with all track attributes,
      audio features, and aggregated play statistics.
      Grain: One row per track (identified by track_id)
    columns:
      - name: track_id
        description: Unique Spotify track identifier
        tests:
          - unique
          - not_null
      - name: track_name
        description: Name of the track
      - name: track_popularity
        description: Spotify popularity score (0-100)
      - name: danceability
        description: How suitable track is for dancing (0.0-1.0)
      - name: energy
        description: Perceptual measure of intensity (0.0-1.0)
      - name: valence
        description: Musical positiveness (0.0-1.0)
      - name: total_plays
        description: Total number of times this track has been played
        
  - name: dim_artists
    description: >
      Dimension table containing one row per artist with all artist attributes
      and aggregated listening statistics.
      Grain: One row per artist (identified by artist_id)
    columns:
      - name: artist_id
        description: Unique Spotify artist identifier
        tests:
          - unique
          - not_null
      - name: artist_name
        description: Name of the artist
      - name: artist_popularity
        description: Spotify popularity score (0-100)
      - name: total_plays
        description: Total number of plays across all tracks by this artist
      - name: total_listening_minutes
        description: Total minutes spent listening to this artist
        
  - name: mart_listening_trends
    description: >
      Analytics mart showing listening behavior trends over time.
      Answers: "How does listening behavior trend daily and weekly?"
      Grain: One row per date
    columns:
      - name: played_date
        description: Date of listening activity
        tests:
          - unique
          - not_null
      - name: total_plays
        description: Total plays on this date
      - name: total_listening_minutes
        description: Total minutes of listening on this date
      - name: plays_7day_avg
        description: 7-day rolling average of daily plays
      - name: avg_danceability
        description: Average danceability of tracks played
        
  - name: mart_artist_listening_time
    description: >
      Analytics mart showing which artists drive the most listening time.
      Answers: "Which artists drive the most listening time?"
      Grain: One row per artist
    columns:
      - name: artist_id
        description: Unique Spotify artist identifier
        tests:
          - unique
          - not_null
      - name: total_listening_minutes
        description: Total minutes spent listening to this artist
      - name: total_listening_hours
        description: Total hours spent listening to this artist
      - name: listening_time_rank
        description: Rank by total listening time (1 = most listened)
      - name: pct_of_total_listening
        description: Percentage of total listening time
        
  - name: mart_track_popularity
    description: >
      Analytics mart showing track popularity with audio features.
      Answers: "How do audio features correlate with popularity?"
      Grain: One row per track
    columns:
      - name: track_id
        description: Unique Spotify track identifier
        tests:
          - unique
          - not_null
      - name: play_count
        description: Number of times track was played
      - name: track_popularity
        description: Spotify popularity score (0-100)
      - name: danceability
        description: Danceability score (0.0-1.0)
      - name: energy
        description: Energy score (0.0-1.0)
      - name: valence
        description: Valence/positiveness score (0.0-1.0)
      - name: danceability_bucket
        description: Categorized danceability level
      - name: energy_bucket
        description: Categorized energy level
      - name: valence_bucket
        description: Categorized valence level
